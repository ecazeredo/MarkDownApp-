name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run tauri build -- --no-bundle

      - name: Rename EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/markdownpp.exe "out/MarkDown++.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownPlusPlus-Windows
          path: out/MarkDown++.exe
          if-no-files-found: error

      - name: Package for the Microsoft Store
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version + ".0"
          ./store/build-msix.ps1 -Version $version

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownPlusPlus-Store-package
          path: out/*.msix
          if-no-files-found: error
