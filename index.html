<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>MarkDown++</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar" role="toolbar" aria-label="Main toolbar">
        <div class="toolbar-group">
          <button id="btn-new" title="New file (Ctrl+N)">New</button>
          <button id="btn-open-file" title="Open file (Ctrl+O)">Open File</button>
          <button id="btn-open-folder" title="Open folder (Ctrl+Shift+O)">Open Folder</button>
          <button id="btn-save" title="Save (Ctrl+S)">Save</button>
          <button id="btn-save-as" title="Save as (Ctrl+Shift+S)">Save As</button>
        </div>
        <div class="toolbar-group" aria-label="Formatting">
          <button class="fmt" data-format="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button class="fmt" data-format="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button class="fmt" data-format="h1" title="Heading 1">H1</button>
          <button class="fmt" data-format="h2" title="Heading 2">H2</button>
          <button class="fmt" data-format="bullet" title="Bulleted list">&bull; List</button>
          <button class="fmt" data-format="ordered" title="Numbered list">1. List</button>
          <button class="fmt" data-format="quote" title="Quote">&ldquo; Quote</button>
          <button class="fmt" data-format="link" title="Link">Link</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="view-switch" role="group" aria-label="View">
          <button id="view-rendered" class="active" aria-pressed="true" title="Formatted view (Ctrl+E)">Rendered</button>
          <button id="view-source" aria-pressed="false" title="Markdown source (Ctrl+E)">Source</button>
        </div>
      </header>

      <nav id="tabs" class="tabs" role="tablist" aria-label="Open files"></nav>

      <div class="workspace">
        <aside class="sidebar" aria-label="Files">
          <div class="sidebar-header">
            <span id="folder-name">Files</span>
            <button id="btn-refresh" class="icon" title="Refresh file list" hidden>&#x21bb;</button>
          </div>
          <div id="file-tree" class="file-tree">
            <p class="sidebar-empty">No folder open.<br /><a href="#" id="link-open-folder">Open a folder</a> to see its Markdown files here.</p>
          </div>
        </aside>

        <main id="document" class="document">
          <div id="empty-state" class="empty-state">
            <h1>MarkDown++</h1>
            <p>Open a Markdown file or a folder to get started, or create a new file.</p>
            <div class="empty-actions">
              <button id="empty-open-file" class="primary">Open File</button>
              <button id="empty-open-folder">Open Folder</button>
              <button id="empty-new">New File</button>
            </div>
            <p class="hint">You can also drag files or a folder onto this window.</p>
          </div>
        </main>
      </div>

      <footer class="statusbar">
        <span id="status-file"></span>
        <span id="status-counts" title=""></span>
      </footer>
    </div>
  </body>
</html>
